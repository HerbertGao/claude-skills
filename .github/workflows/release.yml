name: release

# Triggered by a version tag pushed by scripts/release.sh. The tag commit
# already carries synced versions. This workflow verifies them, then opens a
# draft release with an auto-generated skeleton to finish and publish.
on:
  push:
    tags:
      # Version tags only; vendor-x and v-old cannot trigger verification.
      - "v[0-9]*"

permissions:
  # Create the GitHub release.
  contents: write

concurrency:
  group: release-${{ github.ref }}
  # Never cancel a half-done release.
  cancel-in-progress: false

jobs:
  draft-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags for the changelog range.
          fetch-depth: 0

      - name: Format contract (a drifted literal is a gate that never fires)
        # No upstream clone: a third-party rename cannot break releases. The
        # catalog question belongs to check.yml's scheduled canary.
        run: |
          scripts/check-format.py --self-test
          SKIP_CATALOG_CHECK=1 scripts/check-format.py
          bash evals/review-loop/graders/self-test.sh
          bash evals/council/graders/self-test.sh

      - name: Resolve version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Verify every manifest matches the tag
        shell: bash
        env:
          # Pass via env; never interpolate into the script.
          VER: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          plugins=(
            */.claude-plugin/plugin.json
            codex-plugins/*/.codex-plugin/plugin.json
          )
          if [[ ${#plugins[@]} -eq 0 ]]; then
            echo "::error::no plugin manifests matched"
            exit 1
          fi
          rc=0
          for f in "${plugins[@]}"; do
            got=$(jq -r '.version' "$f")
            if [[ "$got" == "$VER" ]]; then
              echo "ok  $f = $got"
            else
              echo "::error file=$f::version '$got' != tag '$VER'"
              rc=1
            fi
          done
          mf=.claude-plugin/marketplace.json
          got=$(jq -r '.metadata.version' "$mf")
          if [[ "$got" == "$VER" ]]; then
            echo "ok  $mf = $got"
          else
            echo "::error file=$mf::metadata.version mismatch"
            rc=1
          fi

          cmf=.agents/plugins/marketplace.json
          if [[ ! -f "$cmf" ]]; then
            echo "::error file=$cmf::missing Codex marketplace"
            rc=1
          else
            got=$(jq -r '.name // empty' "$cmf")
            if [[ "$got" == "herbertgao-skills-codex" ]]; then
              echo "ok  $cmf name = $got"
            else
              echo "::error file=$cmf::marketplace name mismatch"
              rc=1
            fi
            if [[ "$(jq '.plugins | length' "$cmf")" -eq 0 ]]; then
              echo "::error file=$cmf::no Codex marketplace plugins"
              rc=1
            fi
            while IFS= read -r entry; do
              name=$(jq -r '.name // empty' <<<"$entry")
              source=$(jq -r '.source.source // empty' <<<"$entry")
              path=$(jq -r '.source.path // empty' <<<"$entry")
              manifest="$path/.codex-plugin/plugin.json"
              if [[ -z "$name" || "$source" != "local" || -z "$path" ]]; then
                echo "::error file=$cmf::invalid entry: $name"
                rc=1
                continue
              fi
              if [[ ! -f "$manifest" ]]; then
                echo "::error file=$cmf::missing manifest for '$name'"
                rc=1
                continue
              fi
              manifest_name=$(jq -r '.name // empty' "$manifest")
              if [[ "$manifest_name" == "$name" ]]; then
                echo "ok  $cmf entry $name -> $manifest"
              else
                echo "::error file=$manifest::marketplace name mismatch"
                rc=1
              fi
            done < <(jq -c '.plugins[]' "$cmf")
          fi
          if [[ $rc -ne 0 ]]; then
            echo "::error::release manifest verification failed"
            echo "Fix errors and rerun scripts/release.sh"
            exit 1
          fi

      - name: Build draft notes
        shell: bash
        env:
          REF: ${{ github.ref_name }}
          VER: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          prev=$(
            git describe --tags --abbrev=0 "${REF}^" 2>/dev/null || true
          )
          if [[ -n "$prev" ]]; then
            range=( "${prev}..${REF}" )
          else
            range=( "$REF" )
          fi
          sec() { # <heading> <grep-ere>
            local body
            body=$(
              git log --no-merges --pretty='- %s' \
                "${range[@]}" 2>/dev/null |
                grep -E "$2" || true
            )
            # An empty section must return 0; otherwise `set -e` aborts.
            if [[ -n "$body" ]]; then
              printf '### %s\n%s\n\n' "$1" "$body"
            fi
          }
          {
            echo "## ${REF}"
            echo
            echo "<!-- 草稿：补技术叙事后再 Publish。" \
              "提交按类型分组（范围 ${range[*]}）。 -->"
            echo
            sec "Features" '^- feat'
            sec "Fixes" '^- fix'
            sec "其他 (chore / docs / refactor / ci / build / perf)" \
              '^- (chore|docs|refactor|ci|build|perf|style|test)'
            echo "---"
            echo "_自动草稿（.github/workflows/release.yml）；" \
              "plugin / marketplace 版本统一到 ${VER}。_"
          } > notes.md
          echo "----- notes.md -----"
          cat notes.md

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Probe once and branch on its exit code. An empty result must not be
          # mistaken for a published release.
          if draft=$(
            gh release view "$REF" --json isDraft -q .isDraft 2>/dev/null
          ); then
            if [[ "$draft" == "true" ]]; then
              echo "draft $REF exists — refreshing notes"
              gh release edit "$REF" --draft --notes-file notes.md
            else
              echo "::notice::release $REF is already published"
            fi
          else
            echo "creating draft release $REF"
            gh release create "$REF" \
              --title "$REF" --draft --notes-file notes.md
          fi
